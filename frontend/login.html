<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login | VYBE Clothing</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="/frontend/css/style.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-vybe">
        <div class="container">
            <a class="brand-logo" href="/index.html">
                VYBE<span class="dot"></span>
            </a>
            <a href="/shop.html" class="text-white text-decoration-none" style="font-size: 0.85rem; letter-spacing: 0.1em;">
                <i class="bi bi-arrow-left me-1"></i> BACK TO SHOP
            </a>
        </div>
    </nav>

    <!-- Login Card Container -->
    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="p-4 p-md-5" style="background: var(--bg-surface); border: 1px solid var(--border-subtle);">
                    
                    <div class="text-center mb-4">
                        <span class="tracking-widest-custom text-warning fw-bold" style="font-size: 0.78rem;">SIGN IN</span>
                        <h2 class="text-uppercase fw-bold text-white mt-1 mb-2">ACCESS YOUR ACCOUNT</h2>
                        <p class="text-muted" style="font-size: 0.88rem;">Track previous orders, manage addresses, and view member drops.</p>
                    </div>

                    <!-- Quick Demo Credentials Box -->
                    <div class="p-3 mb-4" style="background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle);">
                        <div class="text-uppercase text-muted fw-bold mb-2" style="font-size: 0.72rem; letter-spacing: 0.1em;">
                            Quick Demo Access (One Click):
                        </div>
                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-sm btn-vybe-dark w-50" onclick="fillDemoCredentials('admin')">
                                <i class="bi bi-shield-lock me-1"></i> Admin Demo
                            </button>
                            <button type="button" class="btn btn-sm btn-vybe-dark w-50" onclick="fillDemoCredentials('customer')">
                                <i class="bi bi-person me-1"></i> Customer Demo
                            </button>
                        </div>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label-vybe" for="loginEmail">Email Address</label>
                            <input type="email" id="loginEmail" class="form-control form-control-vybe" required placeholder="name@example.com">
                        </div>

                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label class="form-label-vybe mb-0" for="loginPassword">Password</label>
                                <a href="javascript:void(0)" class="text-muted text-decoration-none" style="font-size: 0.78rem;" onclick="showToast('Password reset link sent to registered email in demo mode.', 'info')">Forgot?</a>
                            </div>
                            <div class="input-group">
                                <input type="password" id="loginPassword" class="form-control form-control-vybe" required placeholder="••••••••">
                                <button class="btn btn-vybe-dark" type="button" onclick="togglePasswordVisibility()">
                                    <i class="bi bi-eye" id="toggleIcon"></i>
                                </button>
                            </div>
                        </div>

                        <button type="submit" id="loginBtn" class="btn btn-vybe w-100 py-3 mb-3">
                            SIGN IN <i class="bi bi-arrow-right ms-2"></i>
                        </button>
                    </form>

                    <div class="text-center pt-3 border-top border-secondary border-opacity-25" style="font-size: 0.85rem;">
                        <span class="text-muted">Don't have an account yet?</span>
                        <a href="/register.html" class="text-white fw-bold text-decoration-underline ms-1">Create one here</a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer-vybe mt-auto text-center text-muted" style="font-size: 0.8rem; padding: 25px 0;">
        &copy; 2026 VYBE Clothing Inc. All rights reserved.
    </footer>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core JS -->
    <script src="/frontend/js/main.js"></script>

    <script>
        function togglePasswordVisibility() {
            const input = document.getElementById("loginPassword");
            const icon = document.getElementById("toggleIcon");
            if (input.type === "password") {
                input.type = "text";
                icon.className = "bi bi-eye-slash";
            } else {
                input.type = "password";
                icon.className = "bi bi-eye";
            }
        }

        function fillDemoCredentials(type) {
            if (type === 'admin') {
                document.getElementById("loginEmail").value = "admin@vybe.com";
                document.getElementById("loginPassword").value = "VybeAdmin2026!";
            } else {
                document.getElementById("loginEmail").value = "alex@vybe.com";
                document.getElementById("loginPassword").value = "Customer123!";
            }
        }

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("loginBtn");
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> SIGNING IN...`;

            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (res.ok) {
                    setAuth(data.access_token, data.user);
                    showToast(`Welcome back, ${data.user.full_name}!`, "success");

                    setTimeout(() => {
                        if (data.user.role === "admin") {
                            window.location.href = "/admin/index.html";
                        } else {
                            window.location.href = "/account.html";
                        }
                    }, 600);
                } else {
                    showToast(data.detail || "Invalid credentials.", "danger");
                    btn.disabled = false;
                    btn.textContent = "SIGN IN";
                }
            } catch (err) {
                showToast("Connection error. Ensure backend is running.", "danger");
                btn.disabled = false;
                btn.textContent = "SIGN IN";
            }
        });
    </script>
</body>
</html>
