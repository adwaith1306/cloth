<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders & Tracking | VYBE Clothing</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="/frontend/css/style.css">
</head>
<body>

    <!-- Announcement Bar -->
    <div class="announcement-bar text-center">
        <div class="container">
            FREE EXPRESS SHIPPING ACROSS INDIA ON ORDERS OVER ₹1,999
        </div>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-vybe">
        <div class="container">
            <a class="brand-logo" href="index.html">
                VYBE<span class="dot"></span>
            </a>

            <button class="navbar-toggler border-0 text-white" type="button" data-bs-toggle="collapse" data-bs-target="#vybeNav">
                <i class="bi bi-list fs-2"></i>
            </button>

            <div class="collapse navbar-collapse" id="vybeNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link nav-link-vybe" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-vybe" href="shop.html">Shop All</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-vybe active" href="/orders.html">My Orders</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-vybe" href="/account.html">Account</a></li>
                </ul>

                <div class="d-flex align-items-center gap-3">
                    <div id="navUserContainer"></div>
                    <a href="cart.html" class="nav-icon-btn position-relative" title="Shopping Bag">
                        <i class="bi bi-bag"></i>
                        <span class="nav-badge cart-count-badge" style="display: none;">0</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Orders Section -->
    <section class="py-5">
        <div class="container">
            <div class="d-flex justify-content-between align-items-end mb-4 pb-2 border-bottom border-secondary border-opacity-25">
                <div>
                    <span class="tracking-widest-custom text-warning fw-bold" style="font-size: 0.8rem;">PURCHASE HISTORY</span>
                    <h1 class="text-uppercase fw-bold text-white mt-1 mb-0">MY ORDERS</h1>
                </div>
                <a href="shop.html" class="btn btn-vybe-outline" style="font-size: 0.8rem;">
                    EXPLORE NEW DROPS
                </a>
            </div>

            <!-- Orders Container -->
            <div id="ordersContainer">
                <div class="text-center py-5">
                    <div class="spinner-border text-light" role="status"></div>
                    <p class="mt-3 text-muted">Retrieving your orders...</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer-vybe">
        <div class="container text-center text-muted" style="font-size: 0.8rem;">
            &copy; 2026 VYBE Clothing Inc. All rights reserved.
        </div>
    </footer>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core JS -->
    <script src="/frontend/js/main.js"></script>

    <script>
        async function loadCustomerOrders() {
            const container = document.getElementById("ordersContainer");
            const token = getAuthToken();

            if (!token) {
                container.innerHTML = `
                    <div class="text-center py-5 my-4">
                        <i class="bi bi-person-lock text-muted mb-3" style="font-size: 3.5rem;"></i>
                        <h4 class="text-uppercase fw-bold text-white">LOGIN TO VIEW YOUR ORDERS</h4>
                        <p class="text-muted mb-4">Please log in to your account to view your past orders and tracking status.</p>
                        <a href="login.html" class="btn btn-vybe">LOG IN NOW</a>
                    </div>
                `;
                return;
            }

            try {
                const res = await authFetch("/orders/my-orders");
                const orders = await res.json();

                if (!orders || orders.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-5 my-4">
                            <i class="bi bi-box-seam text-muted mb-3" style="font-size: 3.5rem;"></i>
                            <h4 class="text-uppercase fw-bold text-white">NO ORDERS FOUND</h4>
                            <p class="text-muted mb-4">You haven't placed any orders yet. Discover our latest heavyweight streetwear drops.</p>
                            <a href="shop.html" class="btn btn-vybe">START SHOPPING</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = orders.map(renderOrderCard).join("");
            } catch (err) {
                container.innerHTML = `<div class="text-danger py-4">Failed to fetch order history.</div>`;
            }
        }

        function renderOrderCard(order) {
            const statusClass = `status-${order.status.toLowerCase()}`;
            const orderDate = new Date(order.created_at).toLocaleDateString("en-IN", {
                year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
            });

            return `
                <div class="p-4 mb-4" style="background: var(--bg-surface); border: 1px solid var(--border-subtle);">
                    <div class="d-flex flex-wrap justify-content-between align-items-center pb-3 border-bottom border-secondary border-opacity-25 gap-3">
                        <div>
                            <span class="tracking-widest-custom text-muted" style="font-size: 0.72rem;">ORDER PLACED: ${orderDate}</span>
                            <div class="fs-5 fw-bold font-mono text-white mt-1">${order.order_number}</div>
                        </div>
                        <div class="d-flex align-items-center gap-3">
                            <span class="badge-status ${statusClass}">${order.status}</span>
                            <div class="text-end">
                                <div class="text-muted" style="font-size: 0.72rem;">TOTAL PAID</div>
                                <div class="fs-5 fw-bold font-mono text-white">${formatINR(order.total_amount)}</div>
                            </div>
                        </div>
                    </div>

                    <!-- Items List -->
                    <div class="pt-3">
                        ${order.items.map(item => `
                            <div class="d-flex align-items-center gap-3 py-2 border-bottom border-secondary border-opacity-10">
                                <img src="${item.image_url || 'https://images.unsplash.com/photo-1521572267360-ee0c2909d518?auto=format&fit=crop&w=150&q=80'}" alt="${item.product_name}" style="width: 50px; height: 65px; object-fit: cover;">
                                <div class="flex-grow-1">
                                    <div class="fw-bold text-white" style="font-size: 0.92rem;">${item.product_name}</div>
                                    <div class="text-muted" style="font-size: 0.8rem;">
                                        Size: <span class="text-white">${item.size}</span> &bull; Color: <span class="text-white">${item.color}</span> &bull; Qty: ${item.quantity}
                                    </div>
                                </div>
                                <div class="font-mono fw-bold text-white" style="font-size: 0.95rem;">
                                    ${formatINR(item.subtotal)}
                                </div>
                            </div>
                        `).join("")}
                    </div>

                    <!-- Shipping Address & Info footer -->
                    <div class="row pt-3 text-muted" style="font-size: 0.82rem;">
                        <div class="col-md-6 mb-2 mb-md-0">
                            <span class="text-white fw-bold">Delivering to:</span> ${order.customer_name}, ${order.shipping_address}, ${order.city}, ${order.state} (${order.postal_code})
                        </div>
                        <div class="col-md-6 text-md-end">
                            <span class="text-white fw-bold">Payment Method:</span> ${order.payment_method} (${order.payment_status})
                        </div>
                    </div>
                </div>
            `;
        }

        document.addEventListener("DOMContentLoaded", loadCustomerOrders);
    </script>
</body>
</html>
