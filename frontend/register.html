<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | VYBE Clothing</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="/frontend/css/style.css">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-vybe">
        <div class="container">
            <a class="brand-logo" href="/index.html">
                VYBE<span class="dot"></span>
            </a>
            <a href="/login.html" class="text-white text-decoration-none" style="font-size: 0.85rem; letter-spacing: 0.1em;">
                <i class="bi bi-box-arrow-in-right me-1"></i> LOG IN INSTEAD
            </a>
        </div>
    </nav>

    <!-- Register Card Container -->
    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="p-4 p-md-5" style="background: var(--bg-surface); border: 1px solid var(--border-subtle);">
                    
                    <div class="text-center mb-4">
                        <span class="tracking-widest-custom text-warning fw-bold" style="font-size: 0.78rem;">MEMBERSHIP</span>
                        <h2 class="text-uppercase fw-bold text-white mt-1 mb-2">JOIN VYBE CLUB</h2>
                        <p class="text-muted" style="font-size: 0.88rem;">Create your account to track orders and receive VIP capsule drop codes.</p>
                    </div>

                    <form id="registerForm">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label-vybe" for="regName">Full Name *</label>
                                <input type="text" id="regName" class="form-control form-control-vybe" required placeholder="Jordan Lee">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label-vybe" for="regEmail">Email Address *</label>
                                <input type="email" id="regEmail" class="form-control form-control-vybe" required placeholder="jordan@example.com">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label-vybe" for="regPhone">Phone Number</label>
                                <input type="tel" id="regPhone" class="form-control form-control-vybe" placeholder="+91 98000 00000">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label-vybe" for="regPassword">Password *</label>
                                <input type="password" id="regPassword" class="form-control form-control-vybe" required minlength="6" placeholder="Min 6 characters">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label-vybe" for="regConfirm">Confirm Password *</label>
                                <input type="password" id="regConfirm" class="form-control form-control-vybe" required minlength="6" placeholder="Repeat password">
                            </div>
                        </div>

                        <div class="form-check mt-3 mb-4">
                            <input class="form-check-input" type="checkbox" id="regTerms" required>
                            <label class="form-check-label text-muted" for="regTerms" style="font-size: 0.8rem;">
                                I agree to the Terms of Service and Privacy Policy.
                            </label>
                        </div>

                        <button type="submit" id="regBtn" class="btn btn-vybe w-100 py-3 mb-3">
                            CREATE ACCOUNT <i class="bi bi-arrow-right ms-2"></i>
                        </button>
                    </form>

                    <div class="text-center pt-3 border-top border-secondary border-opacity-25" style="font-size: 0.85rem;">
                        <span class="text-muted">Already registered?</span>
                        <a href="/login.html" class="text-white fw-bold text-decoration-underline ms-1">Log in here</a>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer-vybe mt-auto text-center text-muted" style="font-size: 0.8rem; padding: 25px 0;">
        &copy; 2026 VYBE Clothing Inc. All rights reserved.
    </footer>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core JS -->
    <script src="/frontend/js/main.js"></script>

    <script>
        document.getElementById("registerForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const password = document.getElementById("regPassword").value;
            const confirm = document.getElementById("regConfirm").value;

            if (password !== confirm) {
                showToast("Passwords do not match.", "danger");
                return;
            }

            const btn = document.getElementById("regBtn");
            btn.disabled = true;
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> CREATING ACCOUNT...`;

            const payload = {
                full_name: document.getElementById("regName").value.trim(),
                email: document.getElementById("regEmail").value.trim(),
                phone: document.getElementById("regPhone").value.trim(),
                password: password
            };

            try {
                const res = await fetch(`${API_BASE}/auth/register`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (res.ok) {
                    setAuth(data.access_token, data.user);
                    showToast("Account created successfully! Welcome to VYBE.", "success");
                    setTimeout(() => {
                        window.location.href = "/account.html";
                    }, 600);
                } else {
                    showToast(data.detail || "Registration failed.", "danger");
                    btn.disabled = false;
                    btn.textContent = "CREATE ACCOUNT";
                }
            } catch (err) {
                showToast("Connection error. Ensure backend is running.", "danger");
                btn.disabled = false;
                btn.textContent = "CREATE ACCOUNT";
            }
        });
    </script>
</body>
</html>
